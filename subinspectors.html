<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personnel Database</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="assets/style.css">
</head>

<body>

    <svg class="bg-top" viewBox="0 0 1440 320" xmlns="http://www.w3.org/2000/svg">
        <path fill="url(#grad1)"
            d="M0,64L48,80C96,96,192,128,288,128C384,128,480,96,576,101.3C672,107,768,149,864,154.7C960,160,1056,128,1152,96C1248,64,1344,32,1392,16L1440,0L1440,0L1392,0C1344,0,1248,0,1152,0C1056,0,960,0,864,0C768,0,672,0,576,0C480,0,384,0,288,0C192,0,96,0,48,0L0,0Z">
        </path>
        <defs>
            <linearGradient id="grad1">
                <stop offset="0%" stop-color="#00f2fe" />
                <stop offset="100%" stop-color="#4facfe" />
            </linearGradient>
        </defs>
    </svg>

    <div class="container">

        <!-- LOADING SECTION -->
        <div id="loading-msg">Loading database, please wait...</div>

        <!-- LIST VIEW -->
        <div id="list-section">
            <h1>Personnel List</h1>
            <p class="subtitle">Select an entry to view complete details.</p>
            <input type="text" id="search" class="search-bar" placeholder="Search by Name or Belt Number..."
                onkeyup="filterList()">
            <div id="list-container"></div>
        </div>

        <!-- DETAIL VIEW -->
        <div id="detail-section">
            <button class="back-btn" onclick="showList()">&#8592; Back to List</button>
            <div class="profile-header">
                <img id="profile-image" class="profile-pic" src="" alt="Profile Picture">
                <div class="profile-info">
                    <h1 id="detail-name">Name</h1>
                    <p id="detail-belt"><strong>Belt No:</strong> --- | <strong>Designation:</strong> ---</p>
                </div>
            </div>
            <div class="detail-grid" id="detail-container"></div>
        </div>

    </div>
    <script>
        const EXCEL_FILE_PATH = 'assets/subinspectors.xlsx';
    </script>
    <script src="assets/scrip.js"></script>
</body>

</html>
